[project]
name = "autocut"
version = "0.1.0"
description = "Motore di montaggio automatico: sync, trascrizione, tagli, ripetizioni -> timeline.json"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "truststore>=0.10.5",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "onnxruntime>=1.23",
    "numpy>=2.2",
    "pillow>=11",
    "higgsfield-client>=0.2.0",
]

[project.scripts]
autocut = "autocut.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# skill di terze parti (Higgsfield) e progetto Remotion: non sono codice nostro
extend-exclude = [".agents", ".claude", "motion", "inspiration"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# i prompt per Claude sono testo lungo dentro stringhe
"src/autocut/editor/agent.py" = ["E501"]
"src/autocut/sound/manifest.py" = ["E501"]
"src/autocut/render/captions.py" = ["E501"]  # elenco stopword, identico a quello dell'editor
"src/autocut/popups.py" = ["E501"]  # prompt per Claude
"src/autocut/effects.py" = ["E501"]  # galleria e prompt per Claude
"src/autocut/covers.py" = ["E501"]  # prompt per Higgsfield e Claude
"src/autocut/filters.py" = ["E501"]  # tabella dei preset di colore
"src/autocut/vfx.py" = ["E501"]  # comandi ffmpeg/Higgsfield e richieste alla skill
