<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autocut editor</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 4a3 3 0 1 0 2.6 4.5L12 10l-3.4 1.5A3 3 0 1 0 9.4 13L20 8.5V6.6L9.4 11"/></svg>
      </span>
      <span class="brand-name">autocut</span>
      <span class="chip">editor locale</span>
    </div>
    <div class="title" id="project-title">…</div>
    <div class="top-actions">
      <label class="brand-pick" title="Brand pack applicato al video">
        <span>Brand</span>
        <select id="brand-select"><option value="">Nessuno</option></select>
      </label>
      <label class="brand-pick" title="Preset di stile: ritmo, look, sottotitoli, grafiche e suoni">
        <span>Stile</span>
        <select id="style-select"><option value="">Nessuno</option></select>
      </label>
      <span class="save-state" id="save-state">Salvato</span>
      <button class="btn ghost" id="btn-undo-top" title="Annulla l'ultima scelta (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Annulla
      </button>
      <button class="btn export" disabled title="Il render arriva in una fase successiva">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>Esporta
      </button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel left">
      <nav class="tool-tabs" id="tool-tabs"></nav>
      <div class="left-content" id="left-content"></div>
    </aside>

    <section class="panel player">
      <div class="panel-head">
        <span>Lettore — <span id="player-name">timeline</span></span>
        <div class="seg-toggle" id="mode-toggle">
          <button data-mode="edited" class="on" title="Salta le parti tolte (M)">Montato</button>
          <button data-mode="raw" title="Riproduce tutto il raw (M)">Raw</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <div class="frame" id="frame">
          <video id="video" preload="auto" playsinline></video>
          <div class="vignette" id="vignette"></div>
          <div class="trans-fx" id="trans-fx"></div>
          <div class="hook" id="hook"></div>
          <div class="popup-layer" id="popup-layer"></div>
          <div class="safe-zone" id="safe-zone"><span>area sicura Reels / TikTok</span></div>
          <div class="lower-third" id="lower-third"><div class="lt-name"></div><div class="lt-role"></div></div>
          <div class="caption" id="caption"></div>
          <div class="popup-layer over" id="popup-over"></div>
          <div class="cap-guide" id="cap-guide"></div>
          <div class="cap-sel" id="pop-sel">
            <i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>
            <i class="rot" title="Ruota"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></i>
          </div>
          <div class="cap-sel" id="cap-sel">
            <i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i>
            <i class="rot" title="Ruota"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></i>
          </div>
          <div class="cut-flag" id="cut-flag">Parte tolta</div>
        </div>
      </div>
      <div class="transport">
        <div class="tc">
          <span id="tc-now" class="accent">00:00.00</span>
          <span class="sep">/</span>
          <span id="tc-total">00:00.00</span>
          <span class="tc-mode" id="tc-mode">montato</span>
        </div>
        <div class="tc-buttons">
          <button class="icon-btn" id="btn-prev" title="Taglio precedente">
            <svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="m18 6-8 6 8 6z"/></svg>
          </button>
          <button class="icon-btn play" id="btn-play" title="Play/Pausa (Spazio)">
            <svg viewBox="0 0 24 24" class="i-play"><path d="m7 4 13 8-13 8z"/></svg>
            <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
          </button>
          <button class="icon-btn" id="btn-next" title="Taglio successivo">
            <svg viewBox="0 0 24 24"><path d="M18 5v14"/><path d="m6 6 8 6-8 6z"/></svg>
          </button>
        </div>
        <div class="tc-right">
          <button class="pill-btn" id="btn-safe" title="Mostra l'area sicura di Reels e TikTok">Area sicura</button>
          <button class="pill-btn on" id="btn-cc" title="Mostra i sottotitoli nell'anteprima">CC</button>
          <button class="pill-btn full-btn" id="btn-full" title="Guarda il montato in grande (F)">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Schermo intero
          </button>
        </div>
      </div>
    </section>

    <aside class="panel right">
      <div class="right-tabs" id="right-tabs">
        <button data-rtab="ai" class="on">Modifiche AI <span class="count" id="ai-count"></span></button>
        <button data-rtab="popups">Pop-up <span class="count" id="pop-count"></span></button>
        <button data-rtab="boost">Potenzia <span class="spark">✦</span></button>
        <button data-rtab="details">Dettagli</button>
      </div>
      <div class="right-body" id="right-body"></div>
    </aside>
  </main>

  <section class="timeline-area">
    <div class="tl-toolbar">
      <div class="tl-tools">
        <button class="icon-btn" id="tl-undo" title="Annulla (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="icon-btn" disabled title="Ripeti (in arrivo)">
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
        <span class="tl-sep"></span>
        <button class="icon-btn" disabled title="Dividi (in arrivo)">
          <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M5 8h4v8H5zM15 8h4v8h-4z"/></svg>
        </button>
        <button class="tool-btn" id="tl-toggle" disabled title="Togli o ripristina la parte selezionata (Canc)">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><span id="tl-toggle-label">Togli / Ripristina</span>
        </button>
        <span class="tl-sep"></span>
        <span class="tl-stats" id="tl-stats"></span>
      </div>
      <div class="tl-zoom">
        <button class="icon-btn" id="zoom-out" title="Riduci (-)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg>
        </button>
        <input type="range" id="zoom" min="0" max="1000" value="0" aria-label="Zoom timeline">
        <button class="icon-btn" id="zoom-in" title="Ingrandisci (+)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg>
        </button>
        <button class="pill-btn" id="zoom-fit" title="Adatta alla finestra">Adatta</button>
      </div>
    </div>
    <div class="tl-body">
      <div class="tl-heads">
        <div class="head ruler-head"></div>
        <div class="head text-head" title="Sottotitoli dalla trascrizione">
          <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
        </div>
        <div class="head video-head" title="Camera (audio di riferimento)">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
        </div>
      </div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="tl-content" id="tl-content">
          <div class="ruler" id="ruler"></div>
          <div class="track track-text" id="track-text"></div>
          <div class="track track-video" id="track-video">
            <div class="filmstrip" id="filmstrip"></div>
            <canvas class="wave" id="wave"></canvas>
            <div class="ranges" id="ranges"></div>
            <div class="tl-trans" id="tl-trans"></div>
          </div>
          <div class="playhead" id="playhead"><div class="ph-knob"></div></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Visualizzatore a schermo intero: il fotogramma #frame viene spostato qui dentro -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer-stage" id="viewer-stage"></div>
    <aside class="viewer-panel" id="viewer-panel" hidden></aside>
    <div class="viewer-bar">
      <button class="icon-btn play" id="v-play" title="Play/Pausa (Spazio)">
        <svg viewBox="0 0 24 24" class="i-play"><path d="m7 4 13 8-13 8z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
      </button>
      <span class="v-time"><span id="v-now">00:00.00</span><span class="sep">/</span><span id="v-total">00:00.00</span></span>
      <div class="v-seek" id="v-seek" role="slider" aria-label="Posizione nel video" tabindex="0">
        <div class="v-track"><div class="v-cuts" id="v-cuts"></div><div class="v-fill" id="v-fill"></div></div>
        <div class="v-knob" id="v-knob"></div>
        <div class="v-tip" id="v-tip"></div>
      </div>
      <button class="pill-btn on" id="v-mode" title="Montato salta le parti tolte, Raw riproduce tutto (M)">Montato</button>
      <button class="pill-btn on" id="v-cc" title="Sottotitoli">CC</button>
      <button class="pill-btn tx-btn" id="v-text" title="Font, colori, stile e posizione del testo">
        <svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>Testo</button>
      <button class="pill-btn tx-btn" id="v-sticker" title="Sticker e pop-up: aggiungi, sposta, davanti o dietro al testo">
        <svg viewBox="0 0 24 24"><path d="M15 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h7l8-8V6a3 3 0 0 0-3-3h-3z"/><path d="M13 21v-5a3 3 0 0 1 3-3h5"/></svg>Sticker</button>
      <button class="pill-btn tx-btn" id="v-images" title="Cerca foto sul web, scontornale e mettile nel video">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Immagini</button>
      <button class="pill-btn tx-btn" id="v-effects" title="Animazioni di testo e sticker, transizioni tra clip">
        <svg viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>Effetti</button>
      <button class="icon-btn" id="v-close" title="Esci (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="loading" id="loading">Carico il progetto…</div>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
